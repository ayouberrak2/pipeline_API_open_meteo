services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: root 
      POSTGRES_PASSWORD: 12341234
      POSTGRES_DB: pipeline_api_open_meteo
    volumes:
      - postgres_data:/var/lib/postgresql/data

  airflow:
    image: apache/airflow:3.0.6
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://root:12341234@postgres:5432/pipeline_api_open_meteo
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./data:/opt/airflow/data
      - ./src:/opt/airflow/src
    command: standalone

  streamlit:
    image: python:3.12-slim
    depends_on:
      - postgres
    ports:
      - "8501:8501"
    volumes:
      - ./streamlit:/app
      - ./data:/app/data
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir streamlit pandas psycopg2-binary &&
      streamlit run app.py --server.address=0.0.0.0 --server.port=8501"
volumes:
  postgres_data: